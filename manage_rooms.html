<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Ruangan | Secure-Lock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="overlay" id="sidebarOverlay"></div>

    <div class="sidebar p-4" id="mainSidebar">
      <div class="d-flex align-items-center mb-5 px-2">
        <i class="bi bi-shield-lock-fill text-primary fs-3 me-2"></i>
        <h5 class="fw-bold mb-0 text-primary">SECURE-LOCK</h5>
      </div>
      <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link"
          ><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a
        >
        <a href="manage-users.html" class="nav-link"
          ><i class="bi bi-person-gear me-2"></i> Kelola User</a
        >
        <a href="manage-rooms.html" class="nav-link active"
          ><i class="bi bi-door-open me-2"></i> Ruangan</a
        >
        <a href="manage-schedules.html" class="nav-link"
          ><i class="bi bi-calendar-event me-2"></i> Jadwal Kuliah</a
        >
        <div class="mt-auto pt-5">
          <hr class="text-muted opacity-25" />
          <a
            href="javascript:void(0)"
            onclick="logoutUser()"
            class="nav-link text-danger"
            ><i class="bi bi-box-arrow-left me-2"></i> Logout</a
          >
        </div>
      </div>
    </div>

    <button
      class="btn btn-primary fab d-lg-none"
      data-bs-toggle="modal"
      data-bs-target="#modalRoom"
    >
      <i class="bi bi-plus-lg fs-3"></i>
    </button>

    <div class="main-content">
      <nav class="navbar navbar-light bg-transparent mb-4 p-0">
        <div
          class="container-fluid p-0 d-flex justify-content-between align-items-center"
        >
          <button class="btn d-lg-none" id="toggleSidebar">
            <i class="bi bi-list fs-4"></i>
          </button>
          <div
            class="ms-auto d-flex align-items-center bg-white p-2 px-3 rounded-pill shadow-sm border"
          >
            <span id="userName" class="text-dark fw-bold small me-2"
              >Admin</span
            >
            <i class="bi bi-person-circle fs-5 text-primary"></i>
          </div>
        </div>
      </nav>

      <div class="row mb-4 align-items-start">
        <div class="col">
          <h3 class="fw-bold m-0 text-dark">Data Ruangan</h3>
          <p class="text-muted small">Kelola device IoT setiap ruangan</p>
        </div>
        <div class="col-auto d-none d-lg-block">
          <button
            class="btn btn-primary rounded-3 fw-bold px-4 shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#modalRoom"
          >
            <i class="bi bi-plus-lg me-2"></i>Tambah Ruangan
          </button>
        </div>
      </div>

      <div
        class="d-none d-lg-block card border-0 shadow-sm rounded-4 overflow-hidden"
      >
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light text-muted small fw-bold">
              <tr>
                <th class="ps-4 py-3">NAMA RUANGAN</th>
                <th class="py-3">LOKASI</th>
                <th class="py-3">DEVICE ID</th>
                <th class="py-3 text-end pe-4">AKSI</th>
              </tr>
            </thead>
            <tbody id="roomTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="d-lg-none row g-2" id="roomCardContainer"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      $(document).ready(function () {
        const session = checkAuth();
        if (session) {
          $("#userName").text(session.nama_lengkap);
          loadRooms();
        }
        $("#toggleSidebar, #sidebarOverlay").on("click", function () {
          $("#mainSidebar").toggleClass("show");
          $("#sidebarOverlay").toggleClass("show");
        });
      });

      function loadRooms() {
        $.ajax({
          url: `${SB_URL}/ruangan?select=*&order=id.desc`,
          method: "GET",
          headers: SB_HEADERS,
          success: function (data) {
            let rows = "";
            let cards = "";
            data.forEach((r) => {
              rows += `<tr>
                        <td class="ps-4 fw-600 text-dark">${r.nama_ruangan}</td>
                        <td>${r.lokasi}</td>
                        <td><code class="text-primary fw-bold">${r.device_id}</code></td>
                        <td class="text-end pe-4">
                            <button onclick="deleteRoom(${r.id})" class="btn btn-light btn-sm text-danger"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>`;

              cards += `
                    <div class="col-6">
                        <div class="card border-0 shadow-sm p-3 h-100 rounded-4">
                            <div class="d-flex justify-content-between mb-2">
                                <i class="bi bi-door-open-fill text-primary"></i>
                                <i onclick="deleteRoom(${r.id})" class="bi bi-trash text-danger"></i>
                            </div>
                            <h6 class="fw-bold mb-0 text-truncate" style="font-size: 0.85rem;">${r.nama_ruangan}</h6>
                            <p class="text-muted mb-2 text-truncate" style="font-size: 0.65rem;">${r.lokasi}</p>
                            <code class="d-block bg-light p-1 rounded text-center" style="font-size: 0.6rem;">${r.device_id}</code>
                        </div>
                    </div>`;
            });
            $("#roomTableBody").html(rows);
            $("#roomCardContainer").html(cards);
          },
        });
      }

      function deleteRoom(id) {
        Swal.fire({
          title: "Hapus Ruangan?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          confirmButtonText: "Hapus!",
        }).then((result) => {
          if (result.isConfirmed) {
            $.ajax({
              url: `${SB_URL}/ruangan?id=eq.${id}`,
              method: "DELETE",
              headers: SB_HEADERS,
              success: () => location.reload(),
            });
          }
        });
      }
    </script>
  </body>
</html>
