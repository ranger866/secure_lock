<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrak Kuliah | Secure-Lock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <style>
        #toggleSidebar { border-radius: 12px !important; border: 1px solid #edf2f7 !important; background: #fff; padding: 8px 12px; }
        .card-contract { border-radius: 28px; border: 1px solid #edf2f7 !important; transition: 0.3s; }
        .student-item { padding: 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .student-item:last-child { border-bottom: none; }
        .fab-button { position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px; background: #0d6efd; color: white; border-radius: 18px !important; display: flex; align-items: center; justify-content: center; font-size: 24px; border: none; z-index: 1050; }
    </style>
</head>
<body class="bg-light">

<div class="overlay" id="sidebarOverlay"></div>

<div class="sidebar p-4" id="mainSidebar">
    <div class="d-flex align-items-center mb-5 px-2">
        <i class="bi bi-shield-lock-fill text-primary fs-3 me-2"></i>
        <h5 class="fw-bold mb-0 text-primary">SECURE-LOCK</h5>
    </div>
    <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
        <a href="manage_users.html" class="nav-link"><i class="bi bi-person-gear me-2"></i> Kelola User</a>
        <a href="manage_rooms.html" class="nav-link"><i class="bi bi-door-open me-2"></i> Ruangan</a>
        <a href="manage_schedules.html" class="nav-link"><i class="bi bi-calendar-event me-2"></i> Jadwal</a>
        <a href="manage_contracts.html" class="nav-link active"><i class="bi bi-journal-check me-2"></i> Kontrak Kuliah</a>
        <div class="mt-auto pt-5">
            <hr class="text-muted opacity-25">
            <a href="javascript:void(0)" onclick="logoutUser()" class="nav-link text-danger"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
        </div>
    </div>
</div>

<div class="main-content">
    <nav class="navbar navbar-light bg-transparent mb-4 p-0">
        <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
            <button class="btn d-lg-none shadow-sm" id="toggleSidebar">
                <i class="bi bi-list fs-4 text-primary"></i>
            </button>
            <div class="ms-auto d-flex align-items-center bg-white p-2 px-3 rounded-pill shadow-sm border">
                <span id="navUserName" class="text-dark fw-bold small me-2">User</span>
                <i class="bi bi-person-circle fs-5 text-primary"></i>
            </div>
        </div>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4 px-1">
        <div>
            <h4 class="fw-bold mb-0 text-dark">Kontrak Kuliah</h4>
            <p class="text-muted small mb-0">Kelola daftar mahasiswa per mata kuliah.</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
        <label class="small fw-bold text-muted mb-2 text-uppercase">Pilih Jadwal Mata Kuliah</label>
        <select id="selectJadwal" class="form-select border-2 py-2" style="border-radius: 12px;">
            <option value="">-- Memuat Jadwal --</option>
        </select>
    </div>

    <div id="contractContent" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-dark px-2">Mahasiswa Terdaftar</h6>
            <button class="btn btn-sm btn-primary rounded-pill px-3 fw-bold" data-bs-toggle="modal" data-bs-target="#modalTambahPeserta">
                <i class="bi bi-plus-lg me-1"></i> TAMBAH
            </button>
        </div>
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white" id="listPeserta">
            </div>
    </div>

    <div id="noJadwalSelected" class="text-center py-5 opacity-50">
        <i class="bi bi-journal-x fs-1 mb-2 d-block"></i>
        Silakan pilih jadwal terlebih dahulu.
    </div>
</div>

<div class="modal fade" id="modalTambahPeserta" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 28px;">
            <div class="modal-header border-0 pt-4 px-4 pb-0">
                <h5 class="fw-bold mb-0">Tambah Mahasiswa</h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="small fw-bold text-muted mb-1 text-uppercase">Cari Mahasiswa</label>
                    <select id="optMahasiswa" class="form-select border-2" style="border-radius: 12px;"></select>
                </div>
                <button onclick="addContract()" class="btn btn-primary w-100 py-3 fw-bold rounded-4 shadow">DAFTARKAN KE KELAS</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>

<script>
    $(document).ready(function() {
        const session = checkAuth();
        if(session) {
            if(session.role === 'mahasiswa') { location.href = 'dashboard.html'; return; }
            $('#navUserName').text(session.nama_lengkap);
            loadJadwal();
            loadMahasiswa();
        }
        $('#toggleSidebar, #sidebarOverlay').on('click', function() { $('#mainSidebar, #sidebarOverlay').toggleClass('show'); });

        $('#selectJadwal').on('change', function() {
            const val = $(this).val();
            if(val) {
                $('#noJadwalSelected').hide();
                $('#contractContent').fadeIn();
                loadPeserta(val);
            } else {
                $('#contractContent').hide();
                $('#noJadwalSelected').fadeIn();
            }
        });
    });

    function loadJadwal() {
        $.get(`${SB_URL}/jadwal_kuliah?select=id,mata_kuliah,hari&order=hari.asc`, (res) => {
            let opt = '<option value="">-- Pilih Jadwal --</option>';
            res.forEach(j => opt += `<option value="${j.id}">${j.mata_kuliah} (${j.hari})</option>`);
            $('#selectJadwal').html(opt);
        });
    }

    function loadMahasiswa() {
        $.get(`${SB_URL}/users?role=eq.mahasiswa&select=id,nama_lengkap,username&order=nama_lengkap.asc`, (res) => {
            let opt = '<option value="">Cari Nama/NIM...</option>';
            res.forEach(m => opt += `<option value="${m.id}">${m.nama_lengkap} (${m.username})</option>`);
            $('#optMahasiswa').html(opt);
        });
    }

    function loadPeserta(jadwalId) {
        $.get(`${SB_URL}/kontrak_kuliah?jadwal_id=eq.${jadwalId}&select=id,mahasiswa:mahasiswa_id(nama_lengkap,username)&order=id.desc`, (res) => {
            if(res.length === 0) {
                $('#listPeserta').html('<div class="p-4 text-center text-muted small">Belum ada mahasiswa terdaftar di jadwal ini.</div>');
                return;
            }
            let html = '';
            res.forEach(k => {
                html += `<div class="student-item px-4">
                    <div>
                        <div class="fw-bold text-dark small">${k.mahasiswa.nama_lengkap}</div>
                        <div class="text-muted" style="font-size: 10px;">NIM: ${k.mahasiswa.username}</div>
                    </div>
                    <button onclick="deleteContract(${k.id})" class="btn btn-light btn-sm text-danger border-0 shadow-none"><i class="bi bi-x-circle-fill"></i></button>
                </div>`;
            });
            $('#listPeserta').html(html);
        });
    }

    function addContract() {
        const j_id = $('#selectJadwal').val();
        const m_id = $('#optMahasiswa').val();

        if(!m_id) return Swal.fire('Error', 'Pilih mahasiswa dulu!', 'error');

        $.ajax({
            url: `${SB_URL}/kontrak_kuliah`,
            method: "POST", headers: { ...SB_HEADERS, "Content-Type": "application/json" },
            data: JSON.stringify({ jadwal_id: j_id, mahasiswa_id: m_id }),
            success: () => {
                $('#modalTambahPeserta').modal('hide');
                loadPeserta(j_id);
                Swal.fire({ icon: 'success', title: 'Berhasil', timer: 1000, showConfirmButton: false });
            },
            error: () => Swal.fire('Error', 'Mahasiswa mungkin sudah terdaftar.', 'error')
        });
    }

    function deleteContract(id) {
        Swal.fire({ title: 'Hapus Peserta?', text: 'Mahasiswa tidak akan punya akses lagi.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Hapus' }).then((res) => {
            if(res.isConfirmed) {
                $.ajax({ 
                    url: `${SB_URL}/kontrak_kuliah?id=eq.${id}`, 
                    method: "DELETE", 
                    headers: SB_HEADERS, 
                    success: () => loadPeserta($('#selectJadwal').val()) 
                });
            }
        });
    }
</script>
</body>
</html>
