<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola User | Secure-Lock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <style>
      /* Optimasi Card Mobile agar tidak makan tempat */
      .user-card-mobile {
        border: none;
        border-radius: 15px;
        background: white;
        transition: 0.2s;
        height: 100%;
      }
      .user-card-mobile .role-tag {
        font-size: 9px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        text-transform: uppercase;
      }
      .user-name-mobile {
        font-size: 0.85rem;
        font-weight: 700;
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /* FAB tetap bulat, Burger tetap kotak 12px */
    </style>
  </head>
  <body>
    <div class="overlay" id="sidebarOverlay"></div>

    <div class="sidebar p-4" id="mainSidebar">
      <div class="d-flex align-items-center mb-5 px-2">
        <i class="bi bi-shield-lock-fill text-primary fs-3 me-2"></i>
        <h5 class="fw-bold mb-0 text-primary">SECURE-LOCK</h5>
      </div>
      <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link"
          ><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a
        >
        <a href="manage-users.html" class="nav-link active"
          ><i class="bi bi-person-gear me-2"></i> Kelola User</a
        >
        <a href="manage-rooms.html" class="nav-link"
          ><i class="bi bi-door-open me-2"></i> Ruangan</a
        >
        <a href="manage-schedules.html" class="nav-link"
          ><i class="bi bi-calendar-event me-2"></i> Jadwal Kuliah</a
        >
        <div class="mt-auto pt-5">
          <hr class="text-muted opacity-25" />
          <a
            href="javascript:void(0)"
            onclick="logoutUser()"
            class="nav-link text-danger"
            ><i class="bi bi-box-arrow-left me-2"></i> Logout</a
          >
        </div>
      </div>
    </div>

    <button
      class="btn btn-primary fab d-lg-none"
      data-bs-toggle="modal"
      data-bs-target="#modalUser"
    >
      <i class="bi bi-person-plus-fill fs-3"></i>
    </button>

    <div class="main-content">
      <nav class="navbar navbar-light bg-transparent mb-4 p-0">
        <div
          class="container-fluid p-0 d-flex justify-content-between align-items-center"
        >
          <button class="btn d-lg-none" id="toggleSidebar">
            <i class="bi bi-list fs-4"></i>
          </button>
          <div
            class="ms-auto d-flex align-items-center bg-white p-2 px-3 rounded-pill shadow-sm border"
          >
            <span id="userName" class="text-dark fw-bold small me-2"
              >Admin</span
            >
            <i class="bi bi-person-circle fs-5 text-primary"></i>
          </div>
        </div>
      </nav>

      <div class="row mb-4 align-items-start">
        <div class="col">
          <h3 class="fw-bold m-0 text-dark">Data Pengguna</h3>
          <p class="text-muted small">Atur hak akses Dosen & Mahasiswa</p>
        </div>
        <div class="col-auto d-none d-lg-block">
          <button
            class="btn btn-primary rounded-3 fw-bold px-4 shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#modalUser"
          >
            <i class="bi bi-plus-lg me-2"></i>Tambah User
          </button>
        </div>
      </div>

      <div
        class="d-none d-lg-block card border-0 shadow-sm rounded-4 overflow-hidden"
      >
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light text-muted small fw-bold">
              <tr>
                <th class="ps-4 py-3">NAMA LENGKAP</th>
                <th class="py-3">USERNAME / NIM</th>
                <th class="py-3">ROLE</th>
                <th class="py-3 text-end pe-4">AKSI</th>
              </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="d-lg-none row g-2" id="userCardContainer">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalUser" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header border-0 px-4 pt-4">
            <h5 class="fw-bold m-0">Tambah User Baru</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="formAddUser">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1"
                  >NAMA LENGKAP</label
                >
                <input
                  type="text"
                  id="addNama"
                  class="form-control rounded-3"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1"
                  >USERNAME / NIM</label
                >
                <input
                  type="text"
                  id="addUsername"
                  class="form-control rounded-3"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1">PASSWORD</label>
                <input
                  type="password"
                  id="addPassword"
                  class="form-control rounded-3"
                  required
                />
              </div>
              <div>
                <label class="small fw-bold text-muted mb-1">ROLE</label>
                <select id="addRole" class="form-select rounded-3" required>
                  <option value="mahasiswa">Mahasiswa</option>
                  <option value="dosen">Dosen</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-0 p-4 pt-0">
              <button
                type="button"
                class="btn btn-light rounded-3 fw-bold"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button
                type="submit"
                class="btn btn-primary rounded-3 fw-bold px-4"
              >
                Simpan User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      $(document).ready(function () {
        const session = checkAuth();
        if (session) {
          $("#userName").text(session.nama_lengkap);
          loadUsers(session);
        }

        $("#toggleSidebar, #sidebarOverlay").on("click", function () {
          $("#mainSidebar").toggleClass("show");
          $("#sidebarOverlay").toggleClass("show");
        });

        $("#formAddUser").on("submit", function (e) {
          e.preventDefault();
          $.ajax({
            url: `${SB_URL}/users`,
            method: "POST",
            headers: SB_HEADERS,
            data: JSON.stringify({
              nama_lengkap: $("#addNama").val(),
              username: $("#addUsername").val(),
              password: $("#addPassword").val(),
              role: $("#addRole").val(),
            }),
            success: function () {
              $("#modalUser").modal("hide");
              Swal.fire({
                icon: "success",
                title: "Berhasil",
                showConfirmButton: false,
                timer: 1000,
              });
              loadUsers(checkAuth());
            },
          });
        });
      });

      function loadUsers(session) {
        $.ajax({
          url: `${SB_URL}/users?select=*&order=id.desc`,
          method: "GET",
          headers: SB_HEADERS,
          success: function (data) {
            let rows = "";
            let cards = "";
            data.forEach((u) => {
              const isMe = u.id === session.id;
              let color =
                u.role ==="super_admin"? "danger" 
                : "admin"
                  ? "warning"
                  : "dosen"
                    ? "primary"
                    : "secondary";

              // TABLE ROW (DESKTOP)
              rows += `<tr>
                        <td class="ps-4 fw-600 text-dark">${u.nama_lengkap} ${isMe ? '<span class="badge bg-dark-subtle text-dark ms-1" style="font-size:10px">ANDA</span>' : ""}</td>
                        <td>${u.username}</td>
                        <td><span class="badge bg-${color}-subtle text-${color} rounded-pill px-3 py-2 fw-bold" style="font-size:10px">${u.role.toUpperCase()}</span></td>
                        <td class="text-end pe-4">
                            ${isMe ? "-" : `<button onclick="deleteUser(${u.id})" class="btn btn-light btn-sm text-danger"><i class="bi bi-trash"></i></button>`}
                        </td>
                    </tr>`;

              // GRID CARD (MOBILE - 2 COLUMN)
              cards += `
                    <div class="col-6">
                        <div class="user-card-mobile shadow-sm p-3 border">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="role-tag bg-${color}-subtle text-${color}">${u.role}</span>
                                ${!isMe ? `<i onclick="deleteUser(${u.id})" class="bi bi-trash text-danger" style="font-size:0.9rem"></i>` : '<i class="bi bi-person-check text-dark"></i>'}
                            </div>
                            <div class="user-name-mobile mb-0 text-dark">${u.nama_lengkap}</div>
                            <div class="text-muted" style="font-size: 0.65rem;">Username: ${u.username}</div>
                            ${isMe ? `<div class="mt-2 text-center bg-dark bg-opacity-10 rounded small fw-bold" style="font-size:8px">ANDA</div>` : ""}
                        </div>
                    </div>`;
            });
            $("#userTableBody").html(rows);
            $("#userCardContainer").html(cards);
          },
        });
      }

      function deleteUser(id) {
        Swal.fire({
          title: "Hapus User?",
          text: "Aksi tidak bisa dibatalkan!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          confirmButtonText: "Ya, Hapus!",
        }).then((result) => {
          if (result.isConfirmed) {
            $.ajax({
              url: `${SB_URL}/users?id=eq.${id}`,
              method: "DELETE",
              headers: SB_HEADERS,
              success: function () {
                Swal.fire({
                  icon: "success",
                  title: "Terhapus",
                  showConfirmButton: false,
                  timer: 1000,
                });
                location.reload();
              },
            });
          }
        });
      }
    </script>
  </body>
</html>
