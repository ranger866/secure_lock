<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Pengguna | Secure-Lock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <style>
      #toggleSidebar {
        border-radius: 12px !important;
        border: 1px solid #edf2f7 !important;
        background: #fff;
        padding: 8px 12px;
      }
      .card-user {
        border-radius: 28px;
        border: 1px solid #edf2f7 !important;
        transition: 0.3s;
        height: 100%;
      }
      .fab-button {
        position: fixed;
        bottom: 30px;
        right: 25px;
        width: 60px;
        height: 60px;
        background: #0d6efd;
        color: white;
        border-radius: 18px !important;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        border: none;
        z-index: 1050;
      }
      .role-badge {
        font-size: 9px;
        letter-spacing: 0.5px;
        font-weight: 700;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="overlay" id="sidebarOverlay"></div>

    <div class="sidebar p-4" id="mainSidebar">
      <div class="d-flex align-items-center mb-5 px-2">
        <i class="bi bi-shield-lock-fill text-primary fs-3 me-2"></i>
        <h5 class="fw-bold mb-0 text-primary">SECURE-LOCK</h5>
      </div>
      <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link"
          ><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a
        >
        <a href="manage_users.html" class="nav-link active" id="menuUsers"
          ><i class="bi bi-person-gear me-2"></i> Kelola User</a
        >
        <a href="manage_rooms.html" class="nav-link" id="menuRooms"
          ><i class="bi bi-door-open me-2"></i> Ruangan</a
        >
        <a href="manage_schedules.html" class="nav-link" id="menuClasses"
          ><i class="bi bi-calendar-event me-2"></i> Jadwal</a
        >
        <a href="profile.html" class="nav-link"
          ><i class="bi bi-person-circle me-2"></i> Profil</a
        >
        <div class="mt-auto pt-5">
          <hr class="text-muted opacity-25" />
          <a
            href="javascript:void(0)"
            onclick="logoutUser()"
            class="nav-link text-danger"
            ><i class="bi bi-box-arrow-left me-2"></i> Logout</a
          >
        </div>
      </div>
    </div>

    <div class="main-content">
      <nav class="navbar navbar-light bg-transparent mb-4 p-0">
        <div
          class="container-fluid p-0 d-flex justify-content-between align-items-center"
        >
          <button class="btn d-lg-none shadow-sm" id="toggleSidebar">
            <i class="bi bi-list fs-4 text-primary"></i>
          </button>
          <div
            class="ms-auto d-flex align-items-center bg-white p-2 px-3 rounded-pill shadow-sm border"
          >
            <span id="navUserName" class="text-dark fw-bold small me-2"
              >User</span
            >
            <i class="bi bi-person-circle fs-5 text-primary"></i>
          </div>
        </div>
      </nav>

      <div class="d-flex justify-content-between align-items-center mb-4 px-1">
        <div>
          <h4 class="fw-bold mb-0 text-dark">Data Pengguna</h4>
          <p class="text-muted small mb-0">Manajemen hak akses sistem.</p>
        </div>
        <button
          class="btn btn-primary rounded-4 px-4 py-2 fw-bold shadow-sm d-none d-md-block"
          data-bs-toggle="modal"
          data-bs-target="#modalTambahUser"
        >
          <i class="bi bi-person-plus me-2"></i> TAMBAH USER
        </button>
      </div>

      <div id="userContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>

    <button
      class="fab-button d-md-none shadow"
      data-bs-toggle="modal"
      data-bs-target="#modalTambahUser"
    >
      <i class="bi bi-plus-lg"></i>
    </button>

    <div class="modal fade" id="modalTambahUser" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 28px">
          <div class="modal-header border-0 pt-4 px-4 pb-0">
            <h5 class="fw-bold mb-0">Tambah User Baru</h5>
            <button
              type="button"
              class="btn-close shadow-none"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="formTambahUser">
            <div class="modal-body p-4 text-start">
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1 text-uppercase"
                  >Nama Lengkap</label
                >
                <input
                  type="text"
                  name="nama_lengkap"
                  class="form-control border-2"
                  style="border-radius: 12px"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1 text-uppercase"
                  >Username / NIM</label
                >
                <input
                  type="text"
                  name="username"
                  class="form-control border-2"
                  style="border-radius: 12px"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1 text-uppercase"
                  >Password</label
                >
                <input
                  type="password"
                  name="password"
                  class="form-control border-2"
                  style="border-radius: 12px"
                  required
                />
              </div>
              <div class="mb-0">
                <label class="small fw-bold text-muted mb-1 text-uppercase"
                  >Level Akses</label
                >
                <select
                  name="role"
                  class="form-select border-2"
                  style="border-radius: 12px"
                  required
                >
                  <option value="mahasiswa">Mahasiswa</option>
                  <option value="dosen">Dosen</option>
                  <option value="admin">Admin</option>
                  <option value="super_admin">Super Admin</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-0 p-4 pt-0">
              <button
                type="submit"
                class="btn btn-primary w-100 py-3 fw-bold rounded-4 shadow"
              >
                SIMPAN DATA
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
      const ROLE_BADGES = {
        super_admin: "bg-danger",
        admin: "bg-warning text-dark",
        dosen: "bg-success",
        mahasiswa: "bg-primary",
      };

      $(document).ready(function () {
        const session = checkAuth();
        if (session) {
          if (session.role === "mahasiswa") {
            location.href = "dashboard.html";
            return;
          }
          $("#navUserName").text(session.nama_lengkap);
          renderUsers(session);
        }
        $("#toggleSidebar, #sidebarOverlay").on("click", function () {
          $("#mainSidebar, #sidebarOverlay").toggleClass("show");
        });
      });

      function renderUsers(session) {
        $.ajax({
          url: `${SB_URL}/users?select=*&order=nama_lengkap.asc`,
          method: "GET",
          headers: SB_HEADERS,
          success: function (data) {
            // FILTER: Hanya tampilkan user yang ID-nya bukan ID yang sedang login
            const filteredData = data.filter((u) => u.id !== session.id);

            if (filteredData.length === 0) {
              $("#userContainer").html(
                '<div class="text-center py-5 opacity-50">Tidak ada pengguna lain untuk dikelola.</div>',
              );
              return;
            }

            let desktop = `<div class="card border-0 shadow-sm rounded-4 d-none d-md-block overflow-hidden"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="bg-light small fw-bold"><tr><th class="ps-4 py-3">NAMA USER</th><th>USERNAME</th><th>LEVEL</th><th class="text-end pe-4">AKSI</th></tr></thead><tbody>`;
            let mobile = `<div class="row g-2 d-md-none">`;

            filteredData.forEach((u) => {
              const badge = ROLE_BADGES[u.role] || "bg-secondary";
              const roleLabel = u.role.replace("_", " ").toUpperCase();

              desktop += `<tr>
                        <td class="ps-4 fw-bold text-dark">${u.nama_lengkap}</td>
                        <td><code class="text-primary fw-bold">${u.username}</code></td>
                        <td><span class="badge ${badge} rounded-pill role-badge">${roleLabel}</span></td>
                        <td class="text-end pe-4"><button onclick="hapusUser(${u.id})" class="btn btn-light btn-sm text-danger rounded-3 border"><i class="bi bi-trash"></i></button></td>
                    </tr>`;

              mobile += `<div class="col-6"><div class="card card-user p-3 shadow-sm bg-white">
                        <div class="d-flex justify-content-between mb-2"><i class="bi bi-person-circle text-primary"></i><i onclick="hapusUser(${u.id})" class="bi bi-trash text-danger"></i></div>
                        <h6 class="fw-bold mb-1 text-truncate small text-dark">${u.nama_lengkap}</h6>
                        <p class="text-muted mb-2 text-truncate" style="font-size: 10px;">@${u.username}</p>
                        <span class="badge ${badge} w-100 rounded-pill role-badge">${roleLabel}</span>
                    </div></div>`;
            });

            $("#userContainer").html(
              desktop + "</tbody></table></div></div>" + mobile + "</div>",
            );
          },
        });
      }

      $("#formTambahUser").on("submit", function (e) {
        e.preventDefault();
        const data = {};
        $(this)
          .serializeArray()
          .forEach((item) => (data[item.name] = item.value));
        $.ajax({
          url: `${SB_URL}/users`,
          method: "POST",
          headers: { ...SB_HEADERS, "Content-Type": "application/json" },
          data: JSON.stringify(data),
          success: () => {
            $("#modalTambahUser").modal("hide");
            this.reset();
            Swal.fire({
              icon: "success",
              title: "User Ditambahkan",
              timer: 1500,
              showConfirmButton: false,
            });
            renderUsers(checkAuth());
          },
        });
      });

      function hapusUser(id) {
        Swal.fire({
          title: "Hapus User?",
          text: "Data akan dihapus permanen!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Ya, Hapus",
        }).then((res) => {
          if (res.isConfirmed) {
            $.ajax({
              url: `${SB_URL}/users?id=eq.${id}`,
              method: "DELETE",
              headers: SB_HEADERS,
              success: () => renderUsers(checkAuth()),
            });
          }
        });
      }
    </script>
  </body>
</html>
