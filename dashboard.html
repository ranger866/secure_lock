<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Secure-Lock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <style>
      .hero-card {
        background: linear-gradient(135deg, #0d6efd 0%, #003da5 100%);
        border-radius: 30px;
        position: relative;
        overflow: hidden;
      }
      .bi-cpu-bg {
        position: absolute;
        font-size: 150px;
        right: -20px;
        top: -30px;
        opacity: 0.1;
        transform: rotate(-15deg);
      }
      @media (max-width: 768px) {
        .hero-text-wrapper {
          background: rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(12px);
          padding: 20px;
          border-radius: 24px;
          border: 1px solid rgba(255, 255, 255, 0.2);
        }
      }
      .pintu-card {
        border-radius: 28px;
        border: 1px solid #edf2f7 !important;
        transition: 0.3s;
        height: 100%;
      }
      /* Tombol Burger Kotak Standar Bos */
      #toggleSidebar {
        border-radius: 12px !important;
        border: 1px solid #edf2f7 !important;
        background: #fff;
        padding: 8px 12px;
      }
      .fab-button {
        position: fixed;
        bottom: 30px;
        right: 25px;
        width: 60px;
        height: 60px;
        background: #0d6efd;
        color: white;
        border-radius: 18px !important;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        border: none;
        z-index: 1050;
      }
      .empty-state {
        padding: 40px;
        background: white;
        border-radius: 28px;
        border: 2px dashed #dee2e6;
        text-align: center;
        width: 100%;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="overlay" id="sidebarOverlay"></div>

    <div class="sidebar p-4" id="mainSidebar">
      <div class="d-flex align-items-center mb-5 px-2">
        <i class="bi bi-shield-lock-fill text-primary fs-3 me-2"></i>
        <h5 class="fw-bold mb-0 text-primary">SECURE-LOCK</h5>
      </div>
      <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link"
          ><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a
        >
        <a href="manage_users.html" class="nav-link" id="menuUsers"
          ><i class="bi bi-person-gear me-2"></i> Kelola User</a
        >
        <a href="manage_rooms.html" class="nav-link" id="menuRooms"
          ><i class="bi bi-door-open me-2"></i> Ruangan</a
        >
        <a href="manage_schedules.html" class="nav-link" id="menuClasses"
          ><i class="bi bi-calendar-event me-2"></i> Jadwal</a
        >
        <a href="profile.html" class="nav-link active"
          ><i class="bi bi-person-circle me-2"></i> Profil</a
        >
        <div class="mt-auto pt-5">
          <hr class="text-muted opacity-25" />
          <a
            href="javascript:void(0)"
            onclick="logoutUser()"
            class="nav-link text-danger"
            ><i class="bi bi-box-arrow-left me-2"></i> Logout</a
          >
        </div>
      </div>
    </div>

    <div class="main-content">
      <nav class="navbar navbar-light bg-transparent mb-4 p-0">
        <div
          class="container-fluid p-0 d-flex justify-content-between align-items-center"
        >
          <button class="btn d-lg-none shadow-sm" id="toggleSidebar">
            <i class="bi bi-list fs-4 text-primary"></i>
          </button>
          <div
            class="ms-auto d-flex align-items-center bg-white p-2 px-3 rounded-pill shadow-sm border"
          >
            <span id="navUserName" class="text-dark fw-bold small me-2"
              >User</span
            >
            <i class="bi bi-person-circle fs-5 text-primary"></i>
          </div>
        </div>
      </nav>

      <div
        class="hero-card shadow-sm p-4 p-md-5 text-white mb-4 position-relative"
      >
        <i class="bi bi-cpu bi-cpu-bg"></i>
        <div class="hero-text-wrapper position-relative" style="z-index: 2">
          <h3 class="fw-bold mb-1">
            Halo, <span id="welcomeName">User</span>! 👋
          </h3>
          <p class="mb-0 small opacity-75">
            Gunakan akses sesuai jadwal (PJ) atau peminjaman aktif Anda.
          </p>
        </div>
      </div>

      <div
        class="d-flex justify-content-between align-items-center mb-3 px-1 text-uppercase"
      >
        <h6 class="fw-bold text-dark m-0 small" style="letter-spacing: 1px">
          Akses Ruangan Anda
        </h6>
        <button
          id="btnTambahPinjam"
          class="btn btn-primary btn-sm rounded-3 px-3 fw-bold d-none d-md-block"
          data-bs-toggle="modal"
          data-bs-target="#modalPinjam"
        >
          PINJAM RUANGAN
        </button>
      </div>

      <div class="row g-2" id="pintuContainer">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>

    <button
      id="fabPinjam"
      class="fab-button shadow d-md-none d-none"
      data-bs-toggle="modal"
      data-bs-target="#modalPinjam"
    >
      <i class="bi bi-plus-lg"></i>
    </button>

    <div class="modal fade" id="modalPinjam" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 28px">
          <div class="modal-header border-0 pt-4 px-4 pb-0">
            <h5 class="fw-bold mb-0">Pinjam Ruangan</h5>
            <button
              type="button"
              class="btn-close shadow-none"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="formPinjam">
            <div class="modal-body p-4 text-start">
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1">RUANGAN</label>
                <select
                  name="ruangan_id"
                  id="optRuangan"
                  class="form-select border-2 py-2"
                  style="border-radius: 12px"
                  required
                ></select>
              </div>
              <div class="mb-3">
                <label class="small fw-bold text-muted mb-1">HARI</label>
                <select
                  name="hari_pinjam"
                  class="form-select border-2 py-2"
                  style="border-radius: 12px"
                  required
                >
                  <option value="Monday">Senin</option>
                  <option value="Tuesday">Selasa</option>
                  <option value="Wednesday">Rabu</option>
                  <option value="Thursday">Kamis</option>
                  <option value="Friday">Jumat</option>
                  <option value="Saturday">Sabtu</option>
                  <option value="Sunday">Minggu</option>
                </select>
              </div>
              <div class="row g-3">
                <div class="col-6">
                  <label class="small fw-bold text-muted mb-1 text-uppercase"
                    >Mulai</label
                  >
                  <input
                    type="time"
                    name="waktu_mulai"
                    class="form-control border-2"
                    style="border-radius: 12px"
                    required
                  />
                </div>
                <div class="col-6">
                  <label class="small fw-bold text-muted mb-1 text-uppercase"
                    >Selesai</label
                  >
                  <input
                    type="time"
                    name="waktu_selesai"
                    class="form-control border-2"
                    style="border-radius: 12px"
                    required
                  />
                </div>
              </div>
            </div>
            <div class="modal-footer border-0 p-4 pt-0">
              <button
                type="submit"
                class="btn btn-primary w-100 py-3 fw-bold rounded-4 shadow"
              >
                SIMPAN SESI
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
      $(document).ready(function () {
        const session = checkAuth();
        if (session) {
          $("#navUserName").text(session.nama_lengkap);
          $("#welcomeName").text(session.nama_lengkap.split(" ")[0]);

          if (session.role === "admin" || session.role === "super_admin") {
            $("#btnTambahPinjam, #fabPinjam").remove();
          } else {
            $("#fabPinjam").removeClass("d-none");
            loadOptRuangan();
          }

          if (session.role === "mahasiswa")
            $("#menuUsers, #menuRooms, #menuClasses").hide();
          loadDashboard(session);
        }
        $("#toggleSidebar, #sidebarOverlay").on("click", function () {
          $("#mainSidebar, #sidebarOverlay").toggleClass("show");
        });
      });

      async function loadDashboard(session) {
        const now = new Date();
        const hariIni = now.toLocaleDateString("en-US", { weekday: "long" });
        const jamSekarang = now.toTimeString().split(" ")[0]; // HH:mm:ss

        try {
          const jadwal = await $.ajax({
            url: `${SB_URL}/jadwal_kuliah?pj_id=eq.${session.id}&hari=eq.${hariIni}&jam_mulai=lte.${jamSekarang}&jam_selesai=gte.${jamSekarang}&select=*,ruangan(*)`,
            method: "GET",
            headers: SB_HEADERS,
          });

          const pinjam = await $.ajax({
            url: `${SB_URL}/peminjaman?user_id=eq.${session.id}&hari_pinjam=eq.${hariIni}&waktu_mulai=lte.${jamSekarang}&waktu_selesai=gte.${jamSekarang}&select=*,ruangan(*)`,
            method: "GET",
            headers: SB_HEADERS,
          });

          renderUI(jadwal, pinjam);
        } catch (err) {
          console.error(err);
        }
      }

      function renderUI(jadwal, pinjam) {
        let html = "";
        const allAkses = [...jadwal, ...pinjam];

        if (allAkses.length === 0) {
          html = `<div class="col-12"><div class="empty-state text-center py-5"><i class="bi bi-shield-lock text-muted display-1 opacity-25"></i><h5 class="fw-bold text-dark mt-3">Tidak Ada Akses Aktif</h5><p class="text-muted small">Hubungi admin atau buat peminjaman jika butuh akses.</p></div></div>`;
        } else {
          allAkses.forEach((akses) => {
            const isPinjam = akses.kode_akses !== undefined;
            const isOpen = akses.status_kunci == "1";
            const color = isOpen ? "success" : "danger";
            const r = akses.ruangan;

            html += `
                <div class="col-lg-4 col-6 mb-2">
                    <div class="card pintu-card p-3 shadow-sm bg-white border">
                        <div class="d-flex justify-content-between mb-2">
                            <div class="badge bg-${color}-subtle text-${color} rounded-pill px-2" style="font-size: 8px;">${isOpen ? "TERBUKA" : "TERKUNCI"}</div>
                            <i class="bi ${isOpen ? "bi-door-open-fill" : "bi-door-closed-fill"} text-${color} fs-4"></i>
                        </div>
                        <h6 class="fw-bold mb-0 text-truncate text-dark small">${r.nama_ruangan}</h6>
                        <p class="text-muted mb-2 text-truncate" style="font-size: 0.6rem;">${r.lokasi}</p>
                        <div class="bg-light rounded-3 p-2 mb-2 text-center" style="font-size: 0.6rem;">
                            <div class="text-muted fw-bold">AKSES:</div>
                            <div class="text-primary fw-bold">${isPinjam ? akses.kode_akses : "PJ JADWAL"}</div>
                        </div>
                        <button onclick="aksiPintu(${r.id}, ${isOpen ? 0 : 1}, ${isPinjam ? akses.id : "null"})" class="btn btn-${color} w-100 py-2 rounded-3 fw-bold" style="font-size: 9px;">
                            ${isOpen ? "KUNCI" : "BUKA"}
                        </button>
                    </div>
                </div>`;
          });
        }
        $("#pintuContainer").html(html);
      }

      function loadOptRuangan() {
        $.ajax({
          url: `${SB_URL}/ruangan?select=id,nama_ruangan`,
          method: "GET",
          headers: SB_HEADERS,
          success: (data) => {
            let opt = '<option value="">Pilih...</option>';
            data.forEach(
              (r) =>
                (opt += `<option value="${r.id}">${r.nama_ruangan}</option>`),
            );
            $("#optRuangan").html(opt);
          },
        });
      }

      $("#formPinjam").on("submit", function (e) {
        e.preventDefault();
        const session = checkAuth();
        const formData = {
          user_id: session.id,
          ruangan_id: $(this).find('[name="ruangan_id"]').val(),
          hari_pinjam: $(this).find('[name="hari_pinjam"]').val(),
          waktu_mulai: $(this).find('[name="waktu_mulai"]').val() + ":00",
          waktu_selesai: $(this).find('[name="waktu_selesai"]').val() + ":00",
          kode_akses: Math.floor(1000 + Math.random() * 9000).toString(),
          status_kunci: "0",
        };
        $.ajax({
          url: `${SB_URL}/peminjaman`,
          method: "POST",
          headers: { ...SB_HEADERS, "Content-Type": "application/json" },
          data: JSON.stringify(formData),
          success: () => {
            location.reload();
          },
        });
      });

      function aksiPintu(r_id, status, p_id) {
        const targetUrl =
          p_id !== null
            ? `${SB_URL}/peminjaman?id=eq.${p_id}`
            : `${SB_URL}/ruangan?id=eq.${r_id}`;
        $.ajax({
          url: targetUrl,
          method: "PATCH",
          headers: { ...SB_HEADERS, "Content-Type": "application/json" },
          data: JSON.stringify({ status_kunci: status.toString() }),
          success: () => {
            location.reload();
          },
        });
      }
    </script>
  </body>
</html>
