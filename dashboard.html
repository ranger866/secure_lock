<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Secure-Lock</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="overlay" id="sidebarOverlay"></div>

    <div class="sidebar p-4" id="mainSidebar">
      <div class="d-flex align-items-center mb-5 px-2">
        <i class="bi bi-shield-lock-fill text-primary fs-3 me-2"></i>
        <h5 class="fw-bold mb-0 text-primary">SECURE-LOCK</h5>
      </div>
      <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link active"
          ><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a
        >
        <a href="manage_users.html" class="nav-link"
          ><i class="bi bi-person-gear me-2"></i> Kelola User</a
        >
        <a href="manage_rooms.html" class="nav-link"
          ><i class="bi bi-door-open me-2"></i> Ruangan</a
        >
        <a href="manage_schedules.html" class="nav-link"
          ><i class="bi bi-calendar-event me-2"></i> Jadwal Kuliah</a
        >

        <div class="mt-auto pt-5">
          <hr class="text-muted opacity-25" />
          <a
            href="javascript:void(0)"
            onclick="logoutUser()"
            class="nav-link text-danger"
          >
            <i class="bi bi-box-arrow-left me-2"></i> Logout
          </a>
        </div>
      </div>
    </div>

    <button class="btn btn-primary fab" onclick="fetchPeminjaman()">
      <i class="bi bi-arrow-clockwise fs-3"></i>
    </button>

    <div class="main-content">
      <nav class="navbar navbar-light bg-transparent mb-4 p-0">
        <div
          class="container-fluid p-0 d-flex justify-content-between align-items-center"
        >
          <button class="btn d-lg-none" id="toggleSidebar">
            <i class="bi bi-list fs-4"></i>
          </button>

          <div
            class="ms-auto d-flex align-items-center bg-white p-2 px-3 rounded-pill shadow-sm border"
          >
            <span id="userName" class="text-dark fw-bold small me-2"
              >Admin</span
            >
            <i class="bi bi-person-circle fs-5 text-primary"></i>
          </div>
        </div>
      </nav>

      <div class="row mb-4 align-items-start">
        <div class="col">
          <h3 class="fw-bold m-0 text-dark">Kontrol Akses Pintu</h3>
          <p class="text-muted small mb-0">
            Monitor dan kendali pintu secara real-time
          </p>
        </div>
        <div class="col-auto">
          <div class="badge-live">
            <span class="dot-live"></span>
            <span style="font-size: 0.85rem">Live System</span>
          </div>
        </div>
      </div>

      <div class="row g-4" id="pintuContainer">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-2 small">Menghubungkan ke server...</p>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>

    <script>
      $(document).ready(function () {
        const user = checkAuth();
        if (user) {
          $("#userName").text(user.nama_lengkap);
          fetchPeminjaman();
          initRealtime();
        }

        // Sidebar Toggle Logic
        $("#toggleSidebar, #sidebarOverlay").on("click", function () {
          $("#mainSidebar").toggleClass("show");
          $("#sidebarOverlay").toggleClass("show");
        });
      });
    </script>
  </body>
</html>
