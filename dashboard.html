<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Secure-Lock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fe; }
        
        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: white;
            border-right: 1px solid #eef2f6;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .main-content {
            margin-left: 280px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .nav-link {
            color: #64748b;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 5px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            background: #f0f7ff;
            color: #0d6efd;
        }

        /* Mobile Responsive */
        @media (max-width: 991.98px) {
            .sidebar { left: -280px; }
            .sidebar.show { left: 0; }
            .main-content { margin-left: 0; }
            .overlay {
                display: none;
                position: fixed;
                width: 100vw;
                height: 100vh;
                background: rgba(0,0,0,0.1);
                z-index: 999;
            }
            .overlay.show { display: block; }
        }
    </style>
</head>
<body>

<div class="overlay" id="sidebarOverlay"></div>

<div class="sidebar p-4" id="mainSidebar">
    <div class="d-flex align-items-center mb-5 px-2">
        <i class="bi bi-shield-lock-fill text-primary fs-3 me-2"></i>
        <h5 class="fw-bold mb-0 text-primary">SECURE-LOCK</h5>
    </div>

    <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link active"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
        <a href="#" class="nav-link"><i class="bi bi-person-gear me-2"></i> Kelola User</a>
        <a href="#" class="nav-link"><i class="bi bi-door-open me-2"></i> Ruangan</a>
        <a href="#" class="nav-link"><i class="bi bi-calendar-event me-2"></i> Jadwal Kuliah</a>
        
        <div class="mt-auto pt-5">
            <hr class="text-muted opacity-25">
            <a href="javascript:void(0)" onclick="logoutUser()" class="nav-link text-danger">
                <i class="bi bi-box-arrow-left me-2"></i> Logout
            </a>
        </div>
    </div>
</div>

<div class="main-content">
    <nav class="navbar navbar-light bg-transparent mb-4 p-0">
        <div class="container-fluid p-0">
            <button class="btn btn-white border shadow-sm d-lg-none rounded-3" id="toggleSidebar">
                <i class="bi bi-list fs-4"></i>
            </button>
            
            <div class="ms-auto d-flex align-items-center bg-white p-2 px-3 rounded-pill shadow-sm border">
                <span class="small fw-600 text-muted me-2">Halo, <span id="userName" class="text-dark fw-bold">Admin</span></span>
                <i class="bi bi-person-circle fs-5 text-primary"></i>
            </div>
        </div>
    </nav>

    <div class="row mb-4 align-items-center">
        <div class="col">
            <h3 class="fw-bold m-0">Kontrol Akses Pintu</h3>
            <p class="text-muted small">Monitor dan kendali pintu secara real-time</p>
        </div>
        <div class="col-auto">
            <div class="badge bg-white text-success shadow-sm border p-2 px-3 rounded-pill">
                <span class="spinner-grow spinner-grow-sm me-1"></span> Live System
            </div>
        </div>
    </div>

    <div class="row g-4" id="pintuContainer">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary"></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>

<script>
    $(document).ready(function() {
        // 1. Auth Check
        const user = checkAuth();
        if(user) {
            $('#userName').text(user.nama_lengkap);
            fetchPeminjaman();
            initRealtime();
        }

        // 2. Sidebar Toggle Logic
        $('#toggleSidebar, #sidebarOverlay').on('click', function() {
            $('#mainSidebar').toggleClass('show');
            $('#sidebarOverlay').toggleClass('show');
        });
    });
</script>
</body>
</html>
