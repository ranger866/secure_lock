<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadwal Kuliah | Secure-Lock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body>
    <div class="overlay" id="sidebarOverlay"></div>

    <div class="sidebar p-4" id="mainSidebar"></div>

    <button
      class="btn btn-primary fab d-lg-none"
      data-bs-toggle="modal"
      data-bs-target="#modalSchedule"
    >
      <i class="bi bi-calendar-plus fs-3"></i>
    </button>

    <div class="main-content">
      <nav class="navbar navbar-light bg-transparent mb-4 p-0"></nav>

      <div class="row mb-4 align-items-start">
        <div class="col">
          <h3 class="fw-bold m-0 text-dark">Jadwal Kuliah</h3>
          <p class="text-muted small">Akses otomatis sesuai jadwal</p>
        </div>
        <div class="col-auto d-none d-lg-block">
          <button
            class="btn btn-primary rounded-3 fw-bold px-4 shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#modalSchedule"
          >
            <i class="bi bi-plus-lg me-2"></i>Tambah Jadwal
          </button>
        </div>
      </div>

      <div
        class="d-none d-lg-block card border-0 shadow-sm rounded-4 overflow-hidden"
      >
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light text-muted small fw-bold">
              <tr>
                <th class="ps-4 py-3">MATA KULIAH</th>
                <th class="py-3">DOSEN/PJ</th>
                <th class="py-3">RUANGAN</th>
                <th class="py-3">HARI & JAM</th>
                <th class="py-3 text-end pe-4">AKSI</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="d-lg-none row g-2" id="scheduleCardContainer"></div>
    </div>

    <script>
      // Logic loadSchedules dengan dual-render
      function loadSchedules() {
        $.ajax({
          url: `${SB_URL}/jadwal_kuliah?select=*,users(nama_lengkap),ruangan(nama_ruangan)&order=id.desc`,
          method: "GET",
          headers: SB_HEADERS,
          success: function (data) {
            let rows = "";
            let cards = "";
            data.forEach((j) => {
              rows += `<tr>
                        <td class="ps-4 fw-bold text-dark">${j.mata_kuliah}</td>
                        <td>${j.users.nama_lengkap}</td>
                        <td>${j.ruangan.nama_ruangan}</td>
                        <td><span class="badge bg-primary-subtle text-primary">${j.hari}, ${j.jam_mulai.slice(0, 5)}</span></td>
                        <td class="text-end pe-4"><button onclick="deleteSchedule(${j.id})" class="btn btn-light btn-sm text-danger"><i class="bi bi-trash"></i></button></td>
                    </tr>`;

              cards += `
                    <div class="col-6">
                        <div class="card border-0 shadow-sm p-3 h-100 rounded-4 border-start border-primary border-4">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="fw-bold text-primary" style="font-size: 0.6rem;">${j.hari.toUpperCase()}</span>
                                <i onclick="deleteSchedule(${j.id})" class="bi bi-trash text-danger" style="font-size: 0.8rem;"></i>
                            </div>
                            <h6 class="fw-bold mb-1 text-truncate" style="font-size: 0.8rem;">${j.mata_kuliah}</h6>
                            <p class="text-muted mb-1 text-truncate" style="font-size: 0.6rem;">${j.users.nama_lengkap.split(" ")[0]}</p>
                            <div class="bg-light p-1 rounded-2 text-center mt-auto" style="font-size: 0.6rem;">
                                <strong>${j.ruangan.nama_ruangan}</strong><br>${j.jam_mulai.slice(0, 5)}
                            </div>
                        </div>
                    </div>`;
            });
            $("#scheduleTableBody").html(rows);
            $("#scheduleCardContainer").html(cards);
          },
        });
      }
    </script>
  </body>
</html>
